name: build

# Build of every module, a no-`sorry` check of the build log, a comment-stripped source scan,
# a check that the definitions are the audited ones, and an axiom audit of the endpoint theorems
# after checking their types. The project build is cached under a key derived from the hash of all
# Lean sources, the lakefile, the lockfile and the toolchain: a run restores only a build made from
# byte-identical sources, so a run that hits the time limit can be re-run and continues where it stopped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk
        run: |
          set -u
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          if [ -d /mnt ]; then
            free_kb=$(df -Pk /mnt | awk 'NR==2 {print $4}')
            case "${free_kb:-}" in
              ''|*[!0-9]*) free_kb=0 ;;
            esac
            if [ "$free_kb" -gt $((24*1024*1024)) ]; then
              sudo rm -f /mnt/ci.swap || true
              if sudo fallocate -l 16G /mnt/ci.swap; then
                sudo chmod 600 /mnt/ci.swap || true
                sudo mkswap /mnt/ci.swap || true
                sudo swapon /mnt/ci.swap || true
              fi
            fi
          fi
          df -h / /mnt || true
          free -h || true

      - uses: actions/checkout@v4

      - name: Source hash
        id: src
        run: |
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path

          h = hashlib.sha256()
          for name in ("lean-toolchain", "lake-manifest.json", "lakefile.toml"):
              with open(name, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)

          paths = []
          for root in ("Yau", "spec"):
              root_path = Path(root)
              if root_path.exists():
                  paths.extend(p for p in root_path.rglob("*.lean") if p.is_file())
          names = [os.fsencode(p.as_posix()) for p in paths]
          names.sort()
          if names:
              h.update(subprocess.check_output([b"sha256sum", b"-z", b"--"] + names))
          value = h.hexdigest()[:40]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"hash={value}\n")
          print(f"Source hash: {value}")
          PY

      - name: Install elan and the pinned toolchain
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*" >&2; sleep $((i*15)); done; "$@"; }
          installer=$(mktemp)
          retry curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$installer"
          sh "$installer" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          retry elan toolchain install "$(cat lean-toolchain)"
          lake --version

      - name: Restore the project build from earlier runs
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ steps.src.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lake-build-${{ steps.src.outputs.hash }}-

      - name: Report restored build cache
        run: |
          echo "Cache matched key: ${{ steps.restore-build-cache.outputs.cache-matched-key || 'none' }}"

      - name: Fetch Mathlib (official cache)
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*" >&2; sleep $((i*15)); done; "$@"; }
          retry lake exe cache get
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for p in json.loads(Path('lake-manifest.json').read_text())['packages']:
              actual = subprocess.check_output(['git', '-C', '.lake/packages/' + p['name'], 'rev-parse', 'HEAD'], text=True).strip()
              if actual != p['rev']:
                  raise SystemExit('Dependency revision mismatch: ' + p['name'])
          print('All dependency revisions match the lockfile')
          PY
          rm -rf ~/.cache/mathlib
          df -h /

      - name: Build
        timeout-minutes: 320
        run: |
          set -uo pipefail
          rm -f .prune-stop
          python3 scripts/prune_setups.py --loop 20 --stop-file .prune-stop > prune.log 2>&1 &
          pruner=$!
          timeout --signal=TERM --kill-after=120 290m lake build 2>&1 | tee build.log
          lake_status=${PIPESTATUS[0]}
          touch .prune-stop
          for i in $(seq 1 60); do
            kill -0 "$pruner" 2>/dev/null || break
            sleep 1
          done
          kill -0 "$pruner" 2>/dev/null && kill -9 "$pruner" 2>/dev/null || true
          pkill -TERM -x lean 2>/dev/null || true
          pkill -TERM -x lake 2>/dev/null || true
          for i in $(seq 1 60); do
            pgrep -x lean >/dev/null 2>&1 || pgrep -x lake >/dev/null 2>&1 || break
            sleep 1
          done
          pkill -KILL -x lean 2>/dev/null || true
          pkill -KILL -x lake 2>/dev/null || true
          sync
          python3 scripts/prune_setups.py >> prune.log 2>&1 || true
          tail -n 5 prune.log || true
          df -h / || true
          if [ "$lake_status" -eq 124 ] || [ "$lake_status" -eq 137 ]; then
            echo "::error::Build timed out at the self-imposed 290 minute deadline; partial build will be cached for the next attempt"
            exit 1
          fi
          exit "$lake_status"

      - name: Quiesce build directory
        if: always()
        run: |
          pkill -f prune_setups.py 2>/dev/null || true
          pkill -TERM -x lean 2>/dev/null || true
          pkill -TERM -x lake 2>/dev/null || true
          for i in $(seq 1 60); do
            pgrep -f prune_setups.py >/dev/null 2>&1 || pgrep -x lean >/dev/null 2>&1 || pgrep -x lake >/dev/null 2>&1 || break
            sleep 1
          done
          pkill -KILL -f prune_setups.py 2>/dev/null || true
          pkill -KILL -x lean 2>/dev/null || true
          pkill -KILL -x lake 2>/dev/null || true
          sync
          sleep 2
          true

      - name: Save the project build for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ steps.src.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: No sorry and no errors in the build log
        run: |
          if grep -nE "declaration uses ['\`]?sorry|(^|[^a-z])error:" build.log; then
            echo "::error::build log contains sorry or errors"; exit 1
          fi
          echo "no sorry warnings, no errors"

      - name: Definitions are the audited ones
        run: sha256sum -c scripts/DEFINITIONS.sha256

      - name: Source scan (comments and strings removed)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          def strip(src):
              out, i, n, depth = [], 0, len(src), 0
              while i < n:
                  if depth == 0 and src.startswith('--', i):
                      j = src.find('\n', i); i = n if j < 0 else j
                  elif src.startswith('/-', i):
                      depth += 1; i += 2
                  elif depth and src.startswith('-/', i):
                      depth -= 1; i += 2
                  elif depth:
                      out.append('\n' if src[i] == '\n' else ' '); i += 1
                  elif src[i] == '"':
                      j = i + 1
                      while j < n and src[j] != '"':
                          j += 2 if src[j] == '\\' else 1
                      out.append('""'); i = j + 1
                  else:
                      out.append(src[i]); i += 1
              return ''.join(out)
          forbidden = re.compile(
              r"\b(sorry|admit|native_decide|implemented_by|extern|skipKernelTC|unsafe)\b"
              r"|^\s*(@\[[^\]]*\]\s*)*((private|protected|noncomputable|unsafe|partial|local|scoped)\s+)*axiom\b"
              r"|^\s*(@\[[^\]]*\]\s*)*((local|scoped|private|protected)\s+)*(macro|macro_rules|syntax|elab|elab_rules|initialize|builtin_initialize|run_cmd|run_elab|run_meta|declare_syntax_cat)\b"
              r"|^\s*#(eval|exit|reduce)\b"
              r"|@\[csimp\]|set_option\s+debug\.",
              re.M
          )
          bad = []
          for p in sorted(list(Path('Yau').rglob('*.lean')) + list(Path('spec').rglob('*.lean'))):
              text = strip(p.read_text(encoding='utf-8'))
              for m in forbidden.finditer(text):
                  line = text.count('\n', 0, m.start()) + 1
                  bad.append(f'{p}:{line}: {m.group(0).strip()}')
          print('\n'.join(bad) if bad else 'source scan clean')
          sys.exit(1 if bad else 0)
          PY

      - name: Endpoint types and axiom audit
        run: |
          set -euo pipefail
          lake env lean scripts/CheckStatement.lean 2>&1 | tee axioms.txt
          python3 - <<'PY'
          import re, sys
          text = open('axioms.txt').read()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          found = {}
          for name, axs in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", text):
              found[name] = {a.strip() for a in axs.split(',') if a.strip()}
          for name in re.findall(r"'([^']+)' does not depend on any axioms", text):
              found[name] = set()
          want = [l.strip() for l in open('scripts/ENDPOINTS.txt') if l.strip() and not l.startswith('#')]
          bad = False
          for w in want:
              if w not in found:
                  print('MISSING axiom report for', w); bad = True
              elif found[w] - allowed:
                  print('DISALLOWED axioms for', w, sorted(found[w] - allowed)); bad = True
              else:
                  print('OK', w, sorted(found[w]))
          if re.search(r'(^|\n)\S*: error', text) or 'sorryAx' in text:
              print('errors or sorryAx in output'); bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            axioms.txt
            build.log
            prune.log
          if-no-files-found: warn
